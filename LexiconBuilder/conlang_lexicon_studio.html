<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diccionario & Léxico Conlang (Dinámico & Offline)</title>
  
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-surface: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-light: #e0e7ff;
      --danger: #ef4444;
      --mark-bg: rgba(251, 191, 36, 0.4);
    }

    [data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-surface: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-light: #312e81;
      --danger: #f87171;
      --mark-bg: rgba(217, 119, 6, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; transition: background 0.2s, color 0.2s; }

    header { background-color: var(--bg-surface); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 30; }
    .nav-container { max-width: 1200px; margin: 0 auto; padding: 1rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    
    .logo-area { display: flex; align-items: center; gap: 0.75rem; }
    .logo-icon { background: var(--accent); color: white; padding: 0.5rem; border-radius: 0.75rem; display: flex; align-items: center; justify-content: center; }
    h1 { font-size: 1.25rem; font-weight: 700; }
    p.subtitle { font-size: 0.75rem; color: var(--text-muted); }

    .btn-group { display: flex; gap: 0.5rem; align-items: center; }
    button, .btn { background: var(--accent); color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 0.375rem; transition: background 0.2s; }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-color); }
    button.secondary:hover { background: var(--border-color); }

    main { max-width: 1200px; width: 100%; margin: 0 auto; padding: 1.5rem 1rem; flex: 1; display: flex; flex-direction: column; gap: 1.5rem; }

    .controls-panel { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 1rem; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .search-row { display: grid; grid-template-columns: 1fr auto; gap: 0.75rem; }
    @media (max-width: 768px) { .search-row { grid-template-columns: 1fr; } }

    input, select, textarea { width: 100%; background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.625rem 0.875rem; border-radius: 0.5rem; font-size: 0.875rem; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); ring: 2px solid var(--accent); }

    .table-container { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 1rem; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
    th, td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-color); }
    th { background: var(--bg-primary); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; color: var(--text-muted); cursor: pointer; }
    th:hover { background: var(--border-color); }
    tr:hover td { background: rgba(0,0,0,0.02); }
    [data-theme="dark"] tr:hover td { background: rgba(255,255,255,0.02); }

    .cards-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
    .card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 1rem; padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between; gap: 1rem; }

    .badge { display: inline-block; background: var(--accent-light); color: var(--accent); padding: 0.125rem 0.5rem; border-radius: 0.375rem; font-size: 0.75rem; font-weight: 500; margin: 0.125rem; border: 1px solid var(--border-color); }
    
    mark { background-color: var(--mark-bg); color: inherit; border-radius: 0.2rem; padding: 0 0.15rem; }

    .word-link { color: var(--accent); text-decoration: none; font-weight: 600; cursor: pointer; }
    .word-link:hover { text-decoration: underline; }

    /* Pestañas de Paginación Inteligentes */
    .pagination-tabs { display: flex; gap: 0.375rem; flex-wrap: wrap; align-items: center; margin-top: 0.25rem; }
    .page-tab { background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.25rem 0.625rem; border-radius: 0.375rem; font-size: 0.75rem; font-weight: 500; cursor: pointer; }
    .page-tab:hover { background: var(--border-color); }
    .page-tab.active { background: var(--accent); color: white; border-color: var(--accent); }

    /* Modal Detalle */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 50; }
    .modal-overlay.hidden { display: none; }
    .modal { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 1rem; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; position: relative; }

    footer { background: var(--bg-surface); border-top: 1px solid var(--border-color); text-align: center; padding: 1rem; font-size: 0.75rem; color: var(--text-muted); margin-top: auto; }
    .hidden { display: none !important; }
  </style>
</head>
<body data-theme="light">

  <!-- Header -->
  <header>
    <div class="nav-container">
      <div class="logo-area">
        <div class="logo-icon">📖</div>
        <div>
          <h1>Léxico Conlang Dinámico</h1>
          <p class="subtitle">Diccionario interactivo y explorador lingüístico</p>
        </div>
      </div>
      <div class="btn-group">
        <button class="secondary" onclick="toggleViewMode()">🔀 Cambiar Vista (Tabla/Tarjetas)</button>
        <button class="secondary" onclick="toggleTheme()" id="theme-btn">🌙</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Search & Filters -->
    <section class="controls-panel">
      <div class="search-row">
        <input type="text" id="search-input" oninput="render()" placeholder="Busca en cualquier propiedad (palabra, significado, gramática...)...">
        <button class="secondary" onclick="resetSearch()">Limpiar</button>
      </div>
      <div style="font-size: 0.8125rem; color: var(--text-muted);" id="stats-counter">Cargando registros...</div>
      <div id="pagination-tabs" class="pagination-tabs"></div>
    </section>

    <!-- Table View -->
    <div id="table-view" class="table-container">
      <table>
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <!-- Cards View -->
    <div id="cards-view" class="cards-container hidden"></div>
  </main>

  <!-- Modal Detalle -->
  <div id="modal-detail" class="modal-overlay hidden">
    <div class="modal" id="modal-detail-content">
      <!-- Contenido detallado dinámico -->
    </div>
  </div>

  <footer>
    Léxico Conlang &copy; 2026 - Datos cargados desde archivo JS local autónomo (`lexicon-data.js`)
  </footer>

  <!-- Carga del script con los datos separados -->
  <script src="lexicon-data.js"></script>

  <script>
    let currentView = 'table'; // 'table' o 'cards'
    let currentPage = 1;
    let lastQuery = '';
    const ITEMS_PER_PAGE = 10;

    // Inicialización al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof lexiconData === 'undefined') {
        alert("Error: No se pudo cargar el archivo 'lexicon-data.js'. Asegúrate de que esté en la misma carpeta.");
        window.lexiconData = [];
      }
      render();

      // Cerrar modal al hacer clic fuera de él (en el fondo oscuro)
      document.getElementById('modal-detail').addEventListener('click', (event) => {
        if (event.target === event.currentTarget) {
          closeModal();
        }
      });

      // Cerrar modal al pulsar la tecla Escape
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          closeModal();
        }
      });
    });

    // Cambiar Tema Oscuro / Claro
    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙' : '☀️';
    }

    function toggleViewMode() {
      currentView = currentView === 'table' ? 'cards' : 'table';
      document.getElementById('table-view').classList.toggle('hidden', currentView !== 'table');
      document.getElementById('cards-view').classList.toggle('hidden', currentView !== 'cards');
      render();
    }

    function resetSearch() {
      document.getElementById('search-input').value = '';
      currentPage = 1;
      lastQuery = '';
      render();
    }

    // Obtener todas las keys únicas presentes en todo el dataset para construir columnas dinámicas
    function getAllKeys() {
      const keysSet = new Set();
      lexiconData.forEach(item => {
        Object.keys(item).forEach(k => keysSet.add(k));
      });
      return Array.from(keysSet);
    }

    // Filtrar datos según búsqueda global
    function getFilteredData() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      if (!query) return lexiconData;

      return lexiconData.filter(item => {
        return Object.values(item).some(val => {
          if (Array.isArray(val)) {
            return val.some(v => String(v).toLowerCase().includes(query));
          }
          return String(val).toLowerCase().includes(query);
        });
      });
    }

    // Renderizar principal
    function render() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      if (query !== lastQuery) {
        currentPage = 1;
        lastQuery = query;
      }

      const filtered = getFilteredData();
      const keys = getAllKeys();

      const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const paginatedData = filtered.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      document.getElementById('stats-counter').textContent = `Mostrando ${filtered.length} de ${lexiconData.length} registros totales.`;
      renderPagination(totalPages);

      if (currentView === 'table') {
        renderTable(paginatedData, keys, query);
      } else {
        renderCards(paginatedData, query);
      }
    }

    // Paginación inteligente con ventana deslizante y elipsis (...)
    function renderPagination(totalPages) {
      const container = document.getElementById('pagination-tabs');
      if (totalPages <= 1) {
        container.innerHTML = '';
        return;
      }

      let html = '';
      
      // Primera página y elipsis inicial
      if (currentPage > 2) {
        html += `<button class="page-tab" onclick="goToPage(1)">« 1</button>`;
        if (currentPage > 3) {
          html += `<span style="padding: 0.25rem; color: var(--text-muted); font-size: 0.75rem;">...</span>`;
        }
      }

      // Ventana deslizante (2 páginas antes y 2 páginas después de la actual)
      let start = Math.max(1, currentPage - 2);
      let end = Math.min(totalPages, currentPage + 2);

      for (let i = start; i <= end; i++) {
        const activeClass = i === currentPage ? 'page-tab active' : 'page-tab';
        html += `<button class="${activeClass}" onclick="goToPage(${i})">${i}</button>`;
      }

      // Elipsis final y última página
      if (currentPage < totalPages - 1) {
        if (currentPage < totalPages - 2) {
          html += `<span style="padding: 0.25rem; color: var(--text-muted); font-size: 0.75rem;">...</span>`;
        }
        html += `<button class="page-tab" onclick="goToPage(${totalPages})">${totalPages} »</button>`;
      }

      container.innerHTML = html;
    }

    function goToPage(page) {
      currentPage = page;
      render();
    }

    // Renderizar Tabla Dinámica (Solo lectura con palabra enlace)
    function renderTable(data, keys, query) {
      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');

      if (data.length === 0) {
        thead.innerHTML = '';
        tbody.innerHTML = `<tr><td colspan="100" style="text-align:center; padding: 2rem; color: var(--text-muted);">No se encontraron resultados</td></tr>`;
        return;
      }

      // Generar cabeceras dinámicas según las propiedades existentes (sin columna de acciones)
      thead.innerHTML = `<tr>` + keys.map(k => `<th>${escapeHtml(k)}</th>`).join('') + `</tr>`;

      // Generar filas
      tbody.innerHTML = data.map((item, index) => {
        const realIndex = lexiconData.indexOf(item);
        const tds = keys.map(k => {
          const val = item[k];
          const formatted = formatValue(val, query);
          if (k === 'palabra') {
            return `<td><a class="word-link" onclick="openDetail(${realIndex}); return false;" title="Ver detalles">${formatted}</a></td>`;
          }
          return `<td>${formatted}</td>`;
        }).join('');

        return `<tr>${tds}</tr>`;
      }).join('');
    }

    // Renderizar Tarjetas Dinámicas (Solo lectura con palabra enlace)
    function renderCards(data, query) {
      const container = document.getElementById('cards-view');
      if (data.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 2rem; color: var(--text-muted); grid-column: 1/-1;">No se encontraron resultados</div>`;
        return;
      }

      container.innerHTML = data.map((item) => {
        const realIndex = lexiconData.indexOf(item);
        const entriesHtml = Object.entries(item).map(([k, val]) => {
          const formatted = formatValue(val, query);
          const displayVal = (k === 'palabra') 
            ? `<a class="word-link" onclick="openDetail(${realIndex}); return false;" title="Ver detalles">${formatted}</a>` 
            : formatted;

          return `
            <div style="margin-bottom: 0.375rem;">
              <strong style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">${escapeHtml(k)}:</strong>
              <div style="font-size: 0.875rem;">${displayVal}</div>
            </div>
          `;
        }).join('');

        return `
          <div class="card">
            <div>${entriesHtml}</div>
          </div>
        `;
      }).join('');
    }

    // Formatear valores según su tipo (Array, String, etc.) para visualización
    function formatValue(val, query) {
      if (val === undefined || val === null) return '-';
      
      if (Array.isArray(val)) {
        return val.map(v => `<span class="badge">${highlightText(String(v), query)}</span>`).join('');
      }
      return highlightText(String(val), query);
    }

    function highlightText(text, query) {
      if (!query || !text) return escapeHtml(text);
      const re = new RegExp(`(${escapeRegExp(query)})`, 'gi');
      return escapeHtml(text).replace(re, '<mark>$1</mark>');
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // Modal de Detalle Completo Dinámico
    function openDetail(index) {
      const item = lexiconData[index];
      const content = Object.entries(item).map(([k, val]) => `
        <div style="margin-bottom: 1rem;">
          <h4 style="font-size: 0.75rem; text-transform: uppercase; color: var(--accent); margin-bottom: 0.25rem;">${escapeHtml(k)}</h4>
          <div>${formatValue(val, '')}</div>
        </div>
      `).join('');

      document.getElementById('modal-detail-content').innerHTML = `
        <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Detalle de Registro</h3>
        ${content}
        <div style="display: flex; justify-content: flex-end; margin-top: 1rem;">
          <button class="secondary" onclick="closeModal()">Cerrar</button>
        </div>
      `;
      document.getElementById('modal-detail').classList.remove('hidden');
    }

    function closeModal() {
      document.querySelectorAll('.modal-overlay').forEach(m => m.classList.add('hidden'));
    }
  </script>
</body>
</html>
