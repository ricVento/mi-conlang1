<!DOCTYPE html><html lang="es"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Conversor Fonético Personalizado</title>    <style>        :root {            --bg-color: #121214;            --container-bg: #1e1e24;            --text-color: #e1e1e6;            --input-bg: #2a2a32;            --input-border: #3e3e4a;            --accent-color: #4ea8de;            --accent-hover: #64b5f6;            --result-bg: #18181c;        }        body {            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;            max-width: 550px;            margin: 20px auto;            padding: 20px;            background-color: var(--bg-color);            color: var(--text-color);        }        .container {            background: var(--container-bg);            padding: 30px;            border-radius: 12px;            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);        }        h2 {            margin-top: 0;            color: var(--accent-color);            font-size: 24px;        }        label {            font-weight: 600;            display: block;            margin-bottom: 8px;            font-size: 14px;            color: #a4a4b4;        }        input {            width: 100%;            padding: 12px;            font-size: 16px;            background-color: var(--input-bg);            border: 1px solid var(--input-border);            color: var(--text-color);            border-radius: 6px;            box-sizing: border-box;            margin-bottom: 20px;            transition: border-color 0.2s;        }        input:focus {            outline: none;            border-color: var(--accent-color);        }        .resultado-box {            background: var(--result-bg);            padding: 16px;            border-radius: 6px;            font-size: 20px;            font-family: 'Consolas', 'Courier New', monospace;            min-height: 28px;            word-break: break-all;            border: 1px solid var(--input-border);            margin-bottom: 15px;        }        .btn-group {            display: flex;            gap: 10px;            margin-bottom: 20px;        }        button {            padding: 10px 16px;            background-color: var(--input-bg);            color: var(--text-color);            border: 1px solid var(--input-border);            border-radius: 6px;            cursor: pointer;            font-size: 14px;            font-weight: 500;            display: inline-flex;            align-items: center;            gap: 6px;            transition: all 0.2s;        }        button:hover {            background-color: var(--input-border);        }        button.primary {            background-color: var(--accent-color);            color: #121214;            border: none;            font-weight: 600;        }        button.primary:hover {            background-color: var(--accent-hover);        }        /* Estilos de la Tabla Desplegable */        .desplegable-btn {            width: 100%;            justify-content: space-between;        }        .panel-ayuda {            max-height: 0;            overflow: hidden;            transition: max-height 0.3s ease-out;            background: var(--result-bg);            border-radius: 6px;            margin-top: 10px;        }        .panel-ayuda.abierto {            max-height: 250px;            overflow-y: auto;            border: 1px solid var(--input-border);        }        table {            width: 100%;            border-collapse: collapse;            font-size: 14px;            text-align: left;        }        th, td {            padding: 10px 15px;            border-bottom: 1px solid var(--input-border);        }        th {            background-color: var(--container-bg);            color: var(--accent-color);            position: sticky;            top: 0;        }tr:last-child td {            border-bottom: none;        }        .codigo-td {            font-family: monospace;            color: #ffb703;            font-size: 15px;        }        .ipa-td {            font-family: monospace;            font-size: 16px;            font-weight: bold;        }    </style></head><body><div class="container">    <h2>Conversor ASCII a IPA</h2>        <label for="entrada">Escribe en tu código (usa '/' como ruptura):</label>    <input type="text" id="entrada" placeholder="Ej: ae, a/e, dh, d," autofocus>    <label>Resultado IPA:</label>    <div id="resultado" class="resultado-box"></div>        <div class="btn-group">        <button class="primary" onclick="copiarTexto()">📋 Copiar IPA</button>        <button class="desplegable-btn" onclick="toggleAyuda()">💡 Ver guía de comandos <span id="flecha">▼</span></button>    </div>    <!-- Panel de ayuda oculto por defecto -->    <div id="panelAyuda" class="panel-ayuda">        <table>            <thead>                <tr>                    <th>Código</th>                    <th>Símbolo IPA</th>                </tr>            </thead>            <tbody id="tablaCuerpo">                <!-- Se rellena automáticamente con JS -->            </tbody>        </table>    </div></div><script>    // Tu diccionario de reglas personalizado    const reglas = {        "dh": "ð",		"th": "θ",		"S": "ʃ",		"_w": "ʷ",		"4": "gʷ",		"s": "ç",		"zh": "ʒ",		"nh": "ɲ",        "ae": "æ",		"schwa": "ə",        "d,": "ɖ",		"t,": "ʈ",		"n,": "ɳ",		"r,": "ɽ",		"s,": "ʂ",		"z,": "ʐ"    };	    const RUPTURA = "/";    const inputEntrada = document.getElementById('entrada');    const divResultado = document.getElementById('resultado');    const panelAyuda = document.getElementById('panelAyuda');    const flecha = document.getElementById('flecha');    const tablaCuerpo = document.getElementById('tablaCuerpo');    // Generar la tabla de ayuda dinámicamente usando el diccionario    for (const [codigo, ipa] of Object.entries(reglas)) {        const fila = document.createElement('tr');        fila.innerHTML = `<td class="codigo-td">${codigo}</td><td class="ipa-td">${ipa}</td>`;        tablaCuerpo.appendChild(fila);    }    // Escucha la escritura en tiempo real    inputEntrada.addEventListener('input', () => {        let texto = inputEntrada.value;                // 1. Aplicar las reglas de conversión        for (const [codigo, ipa] of Object.entries(reglas)) {            texto = texto.replace(new RegExp(codigo, 'g'), ipa);        }        // 2. Eliminar el carácter de ruptura '/'        texto = texto.replace(new RegExp(RUPTURA, 'g'), "");        divResultado.textContent = texto;    });    // Función para abrir/cerrar el panel de ayuda    function toggleAyuda() {        panelAyuda.classList.toggle('abierto');        if (panelAyuda.classList.contains('abierto')) {            flecha.textContent = "▲";        } else {            flecha.textContent = "▼";        }    }    // Función para copiar al portapapeles    function copiarTexto() {        const texto = divResultado.textContent;        if (texto) {            navigator.clipboard.writeText(texto).then(() => {                alert("¡Copiado al portapapeles con éxito!");            });        }    }</script></body></html>
