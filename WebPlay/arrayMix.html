<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Combinar Todo</title>
	<style>
		.contenedor-columnas {
		  display: flex; /* Activa el diseño de columnas modernas */
		  gap: 20px;     /* Espacio de separación entre las dos columnas */
		}

		.columna {
		  flex: 1;       /* Hace que ambas columnas ocupen el mismo ancho disponible */
		}	
	</style>
	<script src="script.js"></script>
</head>
<body>

    <!-- Contenedor para la lista total -->
	<div class="contenedor-columnas">
	  <div class="columna">
		<h2><div id="col_1"></div></h2>
		<div id="arr_1"></div>
	  </div>
	  <div class="columna">
		<h2><div id="col_2"></div></h2>
		<div id="arr_2"></div>
	  </div>
	</div>
	
    <script>
		
        // Decide con cual arreglo se empareja arr1
		const arr1 = onset;
		const arr2 = vowels;
        
        const invalido = [];
        const resultado = [];
		
		const regex1 = /ñ/;

        // Dos bucles para emparejar CADA elemento de arr1 con CADA elemento de arr2
        for (let i = 0; i < arr1.length; i++) {
            for (let j = 0; j < arr2.length; j++) {
				let str = `${arr1[i]}${arr2[j]}`;
				regex1.test(str) ? invalido.push(str) : resultado.push(str);
            }
        }
		
		const arrTrans = resultado.map(reemplazarPares);
		
		const allArray = [...new Set([...ini, ...mid, ...clust, ...coda])].sort((a, b) => a.localeCompare(b));
			
        // Mostrar en pantalla separados por un salto de línea
        document.getElementById('col_1').innerHTML = arrTrans.length;
        document.getElementById('arr_1').innerHTML = arrTrans.join('<br>');
		document.getElementById('col_2').innerHTML = allArray.length;
        document.getElementById('arr_2').innerHTML = allArray.join('<br>');
    </script>

</body>
</html>
