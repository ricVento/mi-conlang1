<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constructor de Silabas CVC</title>
	<style>
        :root {
            /* Colores planos, uniformes y luminosos */
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --accent-color: #0052ff;
            --border-color: #e2e8f0;
        }	
	
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
		
        .title-cell {
            padding: 12px 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            align-self: flex-start;
        }

        .title-cell h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0;
            color: var(--accent-color);
            letter-spacing: 0.5px;
        }
		
    </style>
	<script src="script.js"></script>
</head>
<body>
    <div class="main-grid">
        <!-- FILA SUPERIOR: TÍTULOS -->
        <div class="title-cell">
            <h2 id="cvTitle">Sílaba CV</h2>
        </div>

        <!-- FILA INFERIOR: DIVS (Reemplazando los textareas anteriores) -->
        <div class="textarea-cell">
            <div id="outputCVR" class="full-textarea">Contenido de la columna derecha...</div>
        </div>
    </div>
	<script>
        // Referencias al DOM
        const outputCVR = document.getElementById('outputCVR');
        const titleCVR = document.getElementById('cvTitle');
	
		// Arrays resultantes
		const cvr_array = [];
		
		// Creamos CV
		for(const o of onset){
			for(const v of vowels){
				for(const m of medial){
					let cvr = o + v + m;
					cvr_array.push(cvr);						
				}
			}			
		}
		
		// Conserva la sílaba SOLO si NO activa ninguna regla prohibida
		const valid_cv_array = cvr_array.filter(str => !regExpRules.some(regex => regex.test(str)));
		
		//const arrTrans = valid_cv_array.map(reemplazarPares);
		const arrTrans = valid_cv_array;
		
		titleCVR.innerHTML = `${valid_cv_array.length} CVR`;
		outputCVR.innerHTML = arrTrans.join("<br>");
		
	</script>
</body>
</html>
